<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="androidPhone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="24" fill="url(#bgGrad2)"/>
  <circle cx="100" cy="100" r="160" fill="#34d399" opacity="0.1"/>
  <circle cx="700" cy="460" r="180" fill="#10b981" opacity="0.08"/>

  <!-- Left Info Card -->
  <g transform="translate(48, 50)">
    <rect width="320" height="420" rx="20" fill="#ffffff" fill-opacity="0.96" filter="url(#shadow2)"/>
    
    <!-- Step Badge -->
    <rect x="24" y="24" width="160" height="28" rx="8" fill="#dcfce7"/>
    <text x="104" y="42" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#15803d" text-anchor="middle">LANGKAH 2A: ANDROID</text>
    
    <text x="24" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Instal di Android</text>
    <text x="24" y="108" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b">Melalui Google Chrome (PWA)</text>

    <!-- Method A: Spanduk Bawah -->
    <rect x="24" y="130" width="272" height="100" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="36" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#166534">Cara Otomatis (Muncul Banner):</text>
    <text x="36" y="174" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">1. Tunggu 2-3 detik saat web dibuka.</text>
    <text x="36" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">2. Klik tombol hijau <tspan font-weight="bold" fill="#047857">"Instal Aplikasi"</tspan>.</text>
    <text x="36" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">3. Ikon otomatis masuk ke layar HP.</text>

    <!-- Method B: Menu Titik Tiga -->
    <rect x="24" y="242" width="272" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="264" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155">Bila Banner Tidak Muncul:</text>
    <text x="36" y="286" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">1. Klik menu <tspan font-weight="bold">Titik Tiga (⋮)</tspan> kanan atas.</text>
    <text x="36" y="308" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">2. Pilih <tspan font-weight="bold" fill="#047857">"Tambahkan ke Layar Utama"</tspan>.</text>
    <text x="36" y="330" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">3. Klik <tspan font-weight="bold">"Instal"</tspan> pada jendela pop-up.</text>

    <!-- Keunggulan PWA Badge -->
    <g transform="translate(24, 365)">
      <rect width="272" height="35" rx="10" fill="#ecfdf5"/>
      <text x="136" y="22" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46" text-anchor="middle">⚡ Ringan, tanpa makan memori PlayStore</text>
    </g>
  </g>

  <!-- Right Phone Mockup -->
  <g transform="translate(420, 25)" filter="url(#shadow2)">
    <rect width="330" height="470" rx="36" fill="url(#androidPhone)" stroke="#334155" stroke-width="4"/>
    <rect x="12" y="14" width="306" height="442" rx="26" fill="#f8fafc"/>
    
    <!-- Camera Pin-hole -->
    <circle cx="165" cy="28" r="6" fill="#0f172a"/>

    <!-- Chrome Top Bar -->
    <g transform="translate(20, 44)">
      <rect width="240" height="34" rx="17" fill="#f1f5f9"/>
      <circle cx="16" cy="17" r="7" fill="#10b981"/>
      <text x="32" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#047857">mubarokah.my.id</text>
      
      <!-- Chrome Menu Dots (3 dots) -->
      <g transform="translate(252, 2)">
        <circle cx="12" cy="15" r="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
        <circle cx="12" cy="9" r="2" fill="#d97706"/>
        <circle cx="12" cy="15" r="2" fill="#d97706"/>
        <circle cx="12" cy="21" r="2" fill="#d97706"/>
      </g>
    </g>

    <!-- Simulated Website Content -->
    <rect x="20" y="90" width="290" height="60" rx="14" fill="#065f46"/>
    <text x="36" y="118" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Mubarokah App</text>
    <text x="36" y="136" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0">Portal Digital Santri &amp; Wali</text>

    <!-- Simulated Chrome Dropdown Menu Overlay -->
    <g transform="translate(130, 84)" filter="url(#shadow2)">
      <rect width="180" height="190" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="26" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Tab baru</text>
      <line x1="10" y1="36" x2="170" y2="36" stroke="#f1f5f9"/>
      <text x="16" y="56" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Bagikan...</text>
      <text x="16" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Cari di halaman</text>
      <line x1="10" y1="94" x2="170" y2="94" stroke="#f1f5f9"/>
      
      <!-- Highlighted "Tambahkan ke Layar Utama" -->
      <rect x="8" y="104" width="164" height="42" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
      <text x="16" y="122" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#15803d">Pasang aplikasi</text>
      <text x="16" y="137" font-family="system-ui, sans-serif" font-size="9" fill="#166534">/ Tambahkan ke Layar</text>

      <text x="16" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Setelan</text>
    </g>

    <!-- Bottom Install Banner Popup Simulation -->
    <g transform="translate(20, 310)" filter="url(#shadow2)">
      <rect width="290" height="130" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      
      <!-- Banner Header -->
      <circle cx="36" cy="38" r="18" fill="#ecfdf5"/>
      <text x="36" y="44" font-size="18" text-anchor="middle">🕌</text>
      <text x="64" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Pasang Mubarokah App</text>
      <text x="64" y="48" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">mubarokah.my.id</text>

      <text x="24" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Pasang aplikasi di layar utama untuk akses cepat &amp; notifikasi santri.</text>

      <!-- Action Buttons -->
      <rect x="18" y="94" width="120" height="26" rx="8" fill="#f1f5f9"/>
      <text x="78" y="111" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="middle">Lain kali</text>

      <rect x="148" y="94" width="124" height="26" rx="8" fill="#047857"/>
      <text x="210" y="111" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Instal Aplikasi</text>
    </g>

    <!-- Indicator Arrow to Dots -->
    <path d="M 240 28 Q 260 20 270 35" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-dasharray="3,2"/>
  </g>
</svg>
