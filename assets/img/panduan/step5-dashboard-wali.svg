<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="phoneGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="24" fill="url(#bgGrad6)"/>
  <circle cx="720" cy="100" r="160" fill="#34d399" opacity="0.1"/>
  <circle cx="100" cy="450" r="150" fill="#f59e0b" opacity="0.08"/>

  <!-- Left Info Card -->
  <g transform="translate(48, 50)">
    <rect width="320" height="420" rx="20" fill="#ffffff" fill-opacity="0.96" filter="url(#shadow6)"/>
    
    <!-- Step Badge -->
    <rect x="24" y="24" width="96" height="28" rx="8" fill="#ecfdf5"/>
    <text x="72" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">LANGKAH 5</text>
    
    <text x="24" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Dashboard Santri</text>
    <text x="24" y="108" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b">Pantau perkembangan anak real-time</text>

    <!-- Feature 1 -->
    <g transform="translate(24, 130)">
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#ecfdf5"/>
      <text x="15" y="20" font-size="14" text-anchor="middle">📖</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">Mutaba'ah &amp; Tahfidz</text>
      <text x="38" y="28" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">Capaian juz, nilai muraja'ah &amp; buku digital</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(24, 185)">
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#eff6ff"/>
      <text x="15" y="20" font-size="14" text-anchor="middle">🗓️</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">Presensi &amp; Sholat</text>
      <text x="38" y="28" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">Kehadiran sholat berjamaah &amp; halaqah</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(24, 240)">
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#fef3c7"/>
      <text x="15" y="20" font-size="14" text-anchor="middle">💳</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">Syahriyah (SPP)</text>
      <text x="38" y="28" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">Tagihan, riwayat setor, &amp; kuitansi resmi</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(24, 295)">
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#fdf2f8"/>
      <text x="15" y="20" font-size="14" text-anchor="middle">👨‍👩‍👧‍👦</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9d174d">Multi-Santri (Pindah Akun)</text>
      <text x="38" y="28" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">Bisa hubungkan 2 atau lebih anak sekaligus</text>
    </g>

    <!-- Success Badge -->
    <rect x="24" y="355" width="272" height="45" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="36" y="375" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#065f46">✨ Login Cepat Berikutnya:</text>
    <text x="36" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#047857">Cukup nomor WhatsApp &amp; PIN yang telah dibuat.</text>
  </g>

  <!-- Right Phone Mockup -->
  <g transform="translate(420, 25)" filter="url(#shadow6)">
    <rect width="330" height="470" rx="36" fill="url(#phoneGrad6)" stroke="#334155" stroke-width="4"/>
    <rect x="12" y="14" width="306" height="442" rx="26" fill="#f8fafc"/>

    <!-- App Header Inside Phone -->
    <rect x="12" y="14" width="306" height="60" rx="26" fill="#047857"/>
    <text x="36" y="48" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Portal Wali Santri</text>
    <rect x="225" y="34" width="75" height="22" rx="6" fill="#f59e0b"/>
    <text x="262" y="49" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">Terhubung ✓</text>

    <!-- Student Info Card Inside Screen -->
    <g transform="translate(24, 85)" filter="url(#shadow6)">
      <rect width="282" height="90" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="34" cy="38" r="20" fill="#ecfdf5"/>
      <text x="34" y="44" font-size="18" text-anchor="middle">👦</text>
      
      <text x="64" y="32" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">Muhammad Yusuf</text>
      <text x="64" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">NIS: 20240105 • Kelas 3 MA Tahfidz</text>
      
      <rect x="64" y="58" width="80" height="18" rx="5" fill="#f1f5f9"/>
      <text x="104" y="70" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Kamar Al-Fatih</text>

      <rect x="150" y="58" width="95" height="18" rx="5" fill="#dcfce7"/>
      <text x="197" y="70" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#15803d" text-anchor="middle">Hafalan: 5 Juz</text>
    </g>

    <!-- Tahfidz Card Progress Inside Screen -->
    <g transform="translate(24, 185)">
      <rect width="282" height="110" rx="16" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadow6)"/>
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#065f46">📖 Mutaba'ah Tahfidz Terkini</text>
      <text x="215" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#047857">Mumtaz ★</text>

      <text x="16" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Setoran Terakhir: Surah Al-Ma'idah (Juz 6)</text>
      
      <!-- Progress Bar -->
      <rect x="16" y="52" width="250" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="16" y="52" width="85" height="8" rx="4" fill="#10b981"/>
      <text x="16" y="74" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#047857">Target: 30 Juz (Progress 16.6%)</text>

      <!-- Mutaba'ah Button -->
      <rect x="16" y="80" width="250" height="22" rx="6" fill="#047857"/>
      <text x="141" y="94" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Buka Buku Mutaba'ah Lengkap →</text>
    </g>

    <!-- Quick Features Row 2 Items -->
    <g transform="translate(24, 305)">
      <!-- Presensi Card -->
      <rect x="0" y="0" width="136" height="80" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">🗓️ Presensi Hari Ini</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="9.5" fill="#16a34a">✓ Sholat Subuh (Hadir)</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9.5" fill="#16a34a">✓ Halaqah Subuh (Hadir)</text>

      <!-- Keuangan Card -->
      <rect x="146" y="0" width="136" height="80" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="158" y="22" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">💳 Syahriyah (SPP)</text>
      <rect x="158" y="32" width="70" height="18" rx="5" fill="#dcfce7"/>
      <text x="193" y="44" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#15803d" text-anchor="middle">Lunas Oktober</text>
      <text x="158" y="66" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0284c7">Lihat Kuitansi ↗</text>
    </g>

    <!-- Multi-Santri Switch Bar -->
    <g transform="translate(24, 395)">
      <rect width="282" height="35" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#334155">👨‍👩‍👧‍👦 Hubungkan Santri Lain / Ganti Santri</text>
      <text x="255" y="22" font-size="12" fill="#047857">⇄</text>
    </g>
  </g>
</svg>
