<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="24" fill="url(#bgGrad)"/>
  <circle cx="720" cy="80" r="180" fill="#10b981" opacity="0.1"/>
  <circle cx="80" cy="450" r="140" fill="#f59e0b" opacity="0.08"/>

  <!-- Left Info Card -->
  <g transform="translate(48, 50)">
    <rect width="320" height="420" rx="20" fill="#ffffff" fill-opacity="0.96" filter="url(#shadow)"/>
    
    <!-- Step Badge -->
    <rect x="24" y="24" width="96" height="28" rx="8" fill="#ecfdf5"/>
    <text x="72" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">LANGKAH 1</text>
    
    <text x="24" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Buka Web Resmi</text>
    <text x="24" y="110" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Gunakan Google Chrome atau Safari</text>

    <!-- Instruction 1 -->
    <g transform="translate(24, 135)">
      <circle cx="14" cy="14" r="14" fill="#047857"/>
      <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Buka Browser di Ponsel</text>
      <text x="38" y="32" font-family="system-ui, sans-serif" font-size="11.5" fill="#64748b">Android: Chrome • iPhone: Safari</text>
    </g>

    <!-- Instruction 2 -->
    <g transform="translate(24, 195)">
      <circle cx="14" cy="14" r="14" fill="#047857"/>
      <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Ketik Alamat Website</text>
      <rect x="38" y="22" width="220" height="30" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="48" y="42" font-family="monospace" font-size="12" font-weight="bold" fill="#047857">mubarokah.my.id</text>
    </g>

    <!-- Instruction 3 -->
    <g transform="translate(24, 275)">
      <circle cx="14" cy="14" r="14" fill="#047857"/>
      <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Periksa Tanda Gembok</text>
      <text x="38" y="32" font-family="system-ui, sans-serif" font-size="11.5" fill="#64748b">Memastikan koneksi aman (HTTPS)</text>
    </g>

    <!-- Security Note Banner -->
    <rect x="24" y="345" width="272" height="52" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="36" y="366" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e">🔒 Keamanan Resmi Pesantren:</text>
    <text x="36" y="384" font-family="system-ui, sans-serif" font-size="10.5" fill="#78350f">Jangan pernah mengisi data di luar domain resmi.</text>
  </g>

  <!-- Right Phone Mockup -->
  <g transform="translate(420, 25)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect width="330" height="470" rx="36" fill="url(#phoneGrad)" stroke="#334155" stroke-width="4"/>
    <!-- Phone Screen -->
    <rect x="12" y="14" width="306" height="442" rx="26" fill="#f8fafc"/>
    <!-- Camera Notch -->
    <rect x="115" y="20" width="100" height="18" rx="9" fill="#0f172a"/>
    <circle cx="195" cy="29" r="4" fill="#1e293b"/>

    <!-- Browser Address Bar -->
    <g transform="translate(24, 48)">
      <rect width="282" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <!-- Lock Icon -->
      <circle cx="22" cy="18" r="9" fill="#10b981"/>
      <path d="M19 18 v-3 a3 3 0 0 1 6 0 v3 h1 a1 1 0 0 1 1 1 v4 a1 1 0 0 1 -1 1 h-8 a1 1 0 0 1 -1 -1 v-4 a1 1 0 0 1 1 -1 z" fill="#ffffff"/>
      <text x="38" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#047857">https://mubarokah.my.id</text>
      <circle cx="262" cy="18" r="3" fill="#94a3b8"/>
    </g>

    <!-- Website Header Inside Screen -->
    <rect x="12" y="96" width="306" height="52" fill="#044e3d"/>
    <!-- Logo Pesantren Mockup -->
    <circle cx="42" cy="122" r="16" fill="#10b981"/>
    <text x="42" y="127" font-family="system-ui, sans-serif" font-size="14" font-weight="black" fill="#ffffff" text-anchor="middle">RM</text>
    <text x="68" y="118" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PPTQ Roudlotul Mubarokah</text>
    <text x="68" y="132" font-family="system-ui, sans-serif" font-size="9" fill="#a7f3d0">Portal Layanan Terpadu</text>

    <!-- Hero Card Inside Screen -->
    <g transform="translate(24, 160)">
      <rect width="282" height="120" rx="16" fill="#065f46"/>
      <text x="18" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Mubarokah App</text>
      <text x="18" y="52" font-family="system-ui, sans-serif" font-size="10.5" fill="#d1fae5">Layanan Informasi Santri &amp; Mutaba'ah</text>
      
      <!-- Quick Portal Button -->
      <rect x="18" y="72" width="130" height="30" rx="8" fill="#f59e0b"/>
      <text x="83" y="91" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Portal Wali Santri →</text>
    </g>

    <!-- Services Grid Inside Screen -->
    <g transform="translate(24, 295)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="62" height="60" rx="12" fill="#ecfdf5"/>
      <text x="31" y="28" font-size="16" text-anchor="middle">📖</text>
      <text x="31" y="48" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#065f46" text-anchor="middle">Tahfidz</text>

      <!-- Item 2 -->
      <rect x="73" y="0" width="62" height="60" rx="12" fill="#eff6ff"/>
      <text x="104" y="28" font-size="16" text-anchor="middle">🗓️</text>
      <text x="104" y="48" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#1e40af" text-anchor="middle">Presensi</text>

      <!-- Item 3 -->
      <rect x="146" y="0" width="62" height="60" rx="12" fill="#fef3c7"/>
      <text x="177" y="28" font-size="16" text-anchor="middle">💳</text>
      <text x="177" y="48" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#92400e" text-anchor="middle">Syahriyah</text>

      <!-- Item 4 -->
      <rect x="219" y="0" width="62" height="60" rx="12" fill="#fdf2f8"/>
      <text x="250" y="28" font-size="16" text-anchor="middle">📢</text>
      <text x="250" y="48" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#9d174d" text-anchor="middle">Warta</text>
    </g>

    <!-- Install Banner Callout -->
    <g transform="translate(24, 375)">
      <rect width="282" height="65" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <circle cx="32" cy="32" r="16" fill="#ecfdf5"/>
      <text x="32" y="38" font-size="16" text-anchor="middle">📲</text>
      <text x="56" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Pasang Mubarokah App</text>
      <text x="56" y="42" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">Akses cepat &amp; hemat memori</text>
      <rect x="200" y="18" width="70" height="28" rx="8" fill="#10b981"/>
      <text x="235" y="36" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Pasang</text>
    </g>
  </g>
</svg>
