<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="iphoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="24" fill="url(#bgGrad3)"/>
  <circle cx="750" cy="120" r="160" fill="#38bdf8" opacity="0.1"/>
  <circle cx="80" cy="450" r="150" fill="#10b981" opacity="0.08"/>

  <!-- Left Info Card -->
  <g transform="translate(48, 50)">
    <rect width="320" height="420" rx="20" fill="#ffffff" fill-opacity="0.96" filter="url(#shadow3)"/>
    
    <!-- Step Badge -->
    <rect x="24" y="24" width="150" height="28" rx="8" fill="#e0f2fe"/>
    <text x="99" y="42" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#0284c7" text-anchor="middle">LANGKAH 2B: IPHONE (IOS)</text>
    
    <text x="24" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Instal di iPhone</text>
    <text x="24" y="108" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b">Wajib menggunakan Safari iOS</text>

    <!-- Instruction 1 -->
    <g transform="translate(24, 130)">
      <circle cx="14" cy="14" r="14" fill="#0284c7"/>
      <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Buka Safari di iPhone</text>
      <text x="38" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Buka link: mubarokah.my.id</text>
    </g>

    <!-- Instruction 2 -->
    <g transform="translate(24, 190)">
      <circle cx="14" cy="14" r="14" fill="#0284c7"/>
      <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Klik Tombol Share (⎋)</text>
      <text x="38" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Ikon kotak panah ke atas di bilah bawah</text>
    </g>

    <!-- Instruction 3 -->
    <g transform="translate(24, 250)">
      <circle cx="14" cy="14" r="14" fill="#0284c7"/>
      <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Pilih "Add to Home Screen"</text>
      <text x="38" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">➕ Tambahkan ke Layar Utama</text>
    </g>

    <!-- Instruction 4 -->
    <g transform="translate(24, 310)">
      <circle cx="14" cy="14" r="14" fill="#0284c7"/>
      <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Klik "Tambah" (Add)</text>
      <text x="38" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Di pojok kanan atas layar</text>
    </g>

    <!-- Note Box -->
    <rect x="24" y="365" width="272" height="38" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="36" y="388" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46">✅ Ikon aplikasi langsung siap di Beranda iOS</text>
  </g>

  <!-- Right iPhone Mockup -->
  <g transform="translate(420, 25)" filter="url(#shadow3)">
    <!-- iPhone Body -->
    <rect width="330" height="470" rx="42" fill="url(#iphoneGrad)" stroke="#334155" stroke-width="4"/>
    <rect x="12" y="14" width="306" height="442" rx="32" fill="#f8fafc"/>

    <!-- Dynamic Island -->
    <rect x="125" y="22" width="80" height="20" rx="10" fill="#000000"/>
    <circle cx="185" cy="32" r="4" fill="#1e293b"/>

    <!-- Content Background -->
    <rect x="20" y="55" width="290" height="110" rx="16" fill="#065f46"/>
    <text x="36" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Mubarokah App</text>
    <text x="36" y="103" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0">Layanan Digital Wali Santri</text>

    <!-- iOS Share Sheet Sheet Simulation -->
    <g transform="translate(20, 180)" filter="url(#shadow3)">
      <rect width="290" height="225" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
      
      <!-- Sheet Handle -->
      <rect x="130" y="8" width="30" height="4" rx="2" fill="#cbd5e1"/>

      <!-- App Info in Share Sheet -->
      <g transform="translate(16, 20)">
        <rect width="36" height="36" rx="10" fill="#047857"/>
        <text x="18" y="24" font-size="18" text-anchor="middle">🕌</text>
        <text x="44" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Mubarokah App</text>
        <text x="44" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">mubarokah.my.id</text>
      </g>

      <line x1="16" y1="65" x2="274" y2="65" stroke="#f1f5f9"/>

      <!-- Option 1: Copy Link -->
      <g transform="translate(16, 75)">
        <text x="8" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Salin Tautan</text>
        <text x="240" y="18" font-size="12">🔗</text>
      </g>

      <line x1="16" y1="105" x2="274" y2="105" stroke="#f1f5f9"/>

      <!-- Option 2 (HIGHLIGHTED): Add to Home Screen -->
      <g transform="translate(8, 115)">
        <rect width="274" height="44" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="12" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">Tambahkan ke Layar Utama</text>
        <text x="12" y="37" font-family="system-ui, sans-serif" font-size="9" fill="#0284c7">(Add to Home Screen)</text>
        <text x="245" y="28" font-size="14">➕</text>
      </g>

      <!-- Option 3: Bookmark -->
      <g transform="translate(16, 175)">
        <text x="8" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Tambah Markah</text>
        <text x="240" y="18" font-size="12">📖</text>
      </g>
    </g>

    <!-- Safari Bottom Navigation Bar -->
    <g transform="translate(12, 412)">
      <rect width="306" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Back / Forward Icons -->
      <text x="30" y="26" font-size="14" fill="#0284c7">‹</text>
      <text x="65" y="26" font-size="14" fill="#94a3b8">›</text>

      <!-- HIGHLIGHTED SHARE BUTTON (CENTER) -->
      <g transform="translate(138, 6)">
        <circle cx="15" cy="15" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
        <!-- Share icon (box with arrow up) -->
        <rect x="9" y="11" width="12" height="12" rx="2" fill="none" stroke="#0284c7" stroke-width="1.5"/>
        <path d="M15 5 v9 M11 9 l4 -4 l4 4" stroke="#0284c7" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Book / Tab icons -->
      <text x="225" y="26" font-size="12" fill="#0284c7">📖</text>
      <text x="270" y="26" font-size="12" fill="#0284c7">❐</text>
    </g>

    <!-- Arrow from Share Button to Sheet -->
    <path d="M 153 400 Q 153 360 153 345" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-dasharray="3,2"/>
  </g>
</svg>
