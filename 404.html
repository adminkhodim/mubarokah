<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mengalihkan...</title>
    <script>
      // Fallback routing untuk SPA (GitHub Pages & Vercel)
      var path = window.location.pathname.replace(/\/+$/, '') || '/';
      if (path === '/administrator' || path === '/admin' || path.startsWith('/app')) {
        window.location.replace('/app');
      } else {
        window.location.replace('/?route=' + encodeURIComponent(window.location.pathname));
      }
    </script>
  </head>

</html>
